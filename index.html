<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppSheet QA Advanced Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b', 700: '#334155' } } } } }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
.dark ::-webkit-scrollbar-track{background:#090d16}.dark ::-webkit-scrollbar-thumb{background:#1e293b}
#sidebar{width:280px;min-width:280px;transition:width .3s,min-width .3s}
#sidebar.collapsed{width:80px!important;min-width:80px!important}
#sidebar.collapsed .sidebar-text{display:none!important}
#sidebar.collapsed #sidebar-brand-box{justify-content:center!important;padding-left:0!important;padding-right:0!important}
#sidebar.collapsed nav button{justify-content:center!important;padding-left:0!important;padding-right:0!important}
.glass-card{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.4)}
.dark .glass-card{background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.08)}
#sidebar-backdrop{display:none}
@media screen and (max-width:768px){
html,body{overflow-x:hidden!important;width:100%!important}
#sidebar{position:fixed!important;top:0;left:0;bottom:0;width:260px!important;min-width:260px!important;transform:translateX(-100%);transition:transform .3s!important;z-index:40}
#sidebar.mobile-open{transform:translateX(0)}
#sidebar.collapsed{width:260px!important;min-width:260px!important}
#sidebar.collapsed .sidebar-text{display:block!important}
#sidebar.collapsed #sidebar-brand-box{justify-content:flex-start!important;padding-left:.25rem!important}
#sidebar.collapsed nav button{justify-content:flex-start!important;padding-left:.875rem!important}
#sidebar-backdrop.mobile-open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
main{padding:0!important;width:100%!important;min-width:0!important}
header{height:auto!important;min-height:auto!important;padding:10px 12px!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important}
header>div.filters{flex-wrap:nowrap!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
header>div.filters::-webkit-scrollbar{display:none}
header>div.filters>*{flex-shrink:0!important}
header #search-input{width:9rem!important}
header .actions{justify-content:flex-end!important;flex-wrap:wrap!important;width:100%!important}
#kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:.75rem!important}
.overflow-x-auto{width:100%!important;-webkit-overflow-scrolling:touch}
#status-el{left:12px;right:12px;bottom:4px;justify-content:center}
}
</style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-dark-950 dark:text-slate-100 h-screen overflow-hidden flex flex-col antialiased transition-colors duration-300">

<div class="fixed top-0 left-0 right-0 h-1 bg-slate-200 dark:bg-slate-900 z-50 overflow-hidden">
  <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div>
</div>

<div class="flex h-full w-full overflow-hidden">
  <div id="sidebar-backdrop" onclick="closeMobileSidebar()"></div>

  <aside id="sidebar" class="bg-white/90 dark:bg-dark-900/90 backdrop-blur-xl border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col justify-between p-4 z-20 h-full overflow-hidden shadow-2xl">
    <div class="space-y-6">
      <div class="flex items-center gap-3 px-1" id="sidebar-brand-box">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-black text-lg flex-shrink-0">QA</div>
        <div class="sidebar-text whitespace-nowrap overflow-hidden">
          <h1 class="font-extrabold text-sm tracking-tight">AppSheet QA</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Enterprise Control Hub</p>
        </div>
      </div>
      <nav class="space-y-2">
        <button onclick="switchPage('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs font-bold transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/25">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span class="sidebar-text whitespace-nowrap overflow-hidden">Overview Dashboard</span>
        </button>
        <button onclick="switchPage('main')" id="nav-main" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span class="sidebar-text whitespace-nowrap overflow-hidden">Data Records Explorer</span>
        </button>
      </nav>
    </div>
    <div class="space-y-3 overflow-hidden bg-slate-50 dark:bg-dark-950/50 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 sidebar-text">
      <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 font-bold">
        <span id="progress-text">System Ready</span><span id="progress-percent" class="text-blue-500">100%</span>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100/70 dark:bg-dark-950 transition-colors duration-300 relative">
    <header class="h-20 min-h-[80px] border-b border-slate-200/80 dark:border-slate-800/80 bg-white/70 dark:bg-dark-900/40 backdrop-blur-xl px-6 flex items-center justify-between z-10 gap-4 shadow-sm">
      <div class="filters flex items-center gap-3 flex-wrap">
        <button onclick="toggleSidebar()" class="p-2.5 rounded-xl bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 shadow-sm flex-shrink-0" title="Toggle Sidebar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 p-1 rounded-xl shadow-sm gap-1" id="presets"></div>
        <div class="relative">
          <input type="text" id="search-input" placeholder="Search database..." class="bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-700 dark:text-slate-200 px-4 py-2.5 pl-9 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm w-40">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div class="relative">
          <button id="task-btn" class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-700 dark:text-slate-200 shadow-sm">
            <span id="task-label">Tasks</span>
            <svg class="w-3 h-3 ml-1 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="task-menu" class="hidden absolute left-0 mt-2 w-64 bg-white dark:bg-dark-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-3 z-50 space-y-1.5 max-h-60 overflow-y-auto"></div>
        </div>
        <select id="user-filter-select" class="bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-700 dark:text-slate-200 px-3.5 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm cursor-pointer"><option value="">All Users</option></select>
        <div class="flex items-center gap-1.5 bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 px-3 py-1.5 rounded-xl text-xs shadow-sm">
          <input type="date" id="start-date-input" class="bg-transparent text-slate-700 dark:text-slate-200 font-semibold focus:outline-none cursor-pointer" title="Start Date">
          <span class="text-slate-400 font-bold">-</span>
          <input type="date" id="end-date-input" class="bg-transparent text-slate-700 dark:text-slate-200 font-semibold focus:outline-none cursor-pointer" title="End Date">
        </div>
        <button id="reset-btn" class="px-3 py-2.5 rounded-xl bg-white dark:bg-dark-800 hover:text-rose-500 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-600 dark:text-slate-300 shadow-sm">Reset</button>
      </div>
      <div class="actions flex items-center gap-2 flex-shrink-0">
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-yellow-400 shadow-sm" title="Toggle Theme">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button onclick="exportCSV()" class="px-3.5 py-2.5 rounded-xl bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-700 dark:text-slate-300 shadow-sm">CSV</button>
        <button onclick="exportExcel()" class="px-3.5 py-2.5 rounded-xl bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700/80 text-xs font-bold text-slate-700 dark:text-slate-300 shadow-sm">Excel</button>
        <button onclick="window.print()" class="px-3.5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-lg shadow-blue-500/20">Print / PDF</button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 pb-24 space-y-6">
      <div id="page-dashboard" class="space-y-6">
        <div id="kpi-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>

        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">
          <div class="p-6 border-b border-slate-200/60 dark:border-slate-800/60 flex justify-between items-center bg-gradient-to-r from-blue-500/10 via-indigo-500/5 to-transparent">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-800 dark:text-white">Leaderboard</h3>
            <span class="bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-extrabold px-3 py-1.5 rounded-xl border border-blue-500/20">Live Ranking</span>
          </div>
          <div class="p-6"><div id="leaderboard-container" class="space-y-3"></div></div>
        </div>

        <div id="chart-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <div class="glass-card rounded-3xl shadow-xl overflow-hidden">
          <div class="p-5 border-b border-slate-200/60 dark:border-slate-800/60 flex justify-between items-center">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300">Today's Activity Breakdown</h3>
            <span id="today-count-badge" class="bg-emerald-500/10 text-emerald-500 text-xs font-extrabold px-3 py-1 rounded-xl border border-emerald-500/20">0 Cases Today</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead id="today-table-head" class="bg-slate-50/50 dark:bg-dark-950/50 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider border-b border-slate-200/60 dark:border-slate-800/60 cursor-pointer select-none"></thead>
              <tbody id="today-activity-body" class="divide-y divide-slate-100 dark:divide-slate-800/40"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="page-main" class="hidden space-y-6">
        <div class="glass-card rounded-3xl shadow-xl overflow-hidden">
          <div class="p-5 border-b border-slate-200/60 dark:border-slate-800/60">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300">DATASET RECORDS EXPLORER (CLICK HEADER TO SORT)</h3>
          </div>
          <div class="overflow-x-auto max-h-[600px]">
            <table class="w-full text-left text-xs">
              <thead id="table-head" class="bg-slate-50/70 dark:bg-dark-950/70 sticky top-0 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider border-b border-slate-200/60 dark:border-slate-800/60 z-10 select-none"></thead>
              <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800/40"></tbody>
            </table>
          </div>
        </div>
      </div>

<div id="status-el" class="fixed bottom-1 right-2 z-50 text-[11px] bg-white/90 dark:bg-dark-900/90 backdrop-blur-xl text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-xl font-bold border border-slate-200/80 dark:border-slate-800 shadow-lg flex items-center gap-2 transition-opacity duration-500">
  <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Connecting to server...
</div>

<script>
const targetUrl = 'https://script.google.com/macros/s/AKfycbzwtMphAx2VGGiDfuJVRSInH5wy54E6K2hSpwhX2PdI_boeeYqb2YNyTPuHJJIFgDxE/exec';

let rawData = [], filteredData = [], headers = [];
let uniqueTasks = new Set(), uniqueUsers = new Set();
let currentSortColumn = null, currentSortDirection = 'asc';
let columnFilters = {};
let todaySortColumn = null, todaySortDirection = 'asc';
let charts = {};

const $ = id => document.getElementById(id);
const statusEl = $('status-el'), taskBtn = $('task-btn'), taskMenu = $('task-menu'), taskLabel = $('task-label');
const userFilterSelect = $('user-filter-select'), startDateInput = $('start-date-input'), endDateInput = $('end-date-input');
const searchInput = $('search-input'), resetBtn = $('reset-btn'), sidebar = $('sidebar'), sidebarBackdrop = $('sidebar-backdrop');

/* ---------- Static blocks built from small lists ---------- */
const PRESET_ON = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white";
const PRESET_OFF = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700";
const PRESETS = ['all', 'weekly', 'monthly', 'yearly'];
$('presets').innerHTML = PRESETS.map(p =>
  `<button onclick="setDatePreset('${p}')" id="preset-${p}" class="${p === 'all' ? PRESET_ON : PRESET_OFF}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('');

const KPIS = [
  ['total', 'Total Rows', 'Database', 'text-slate-900 dark:text-white', 'bg-blue-500/10 text-blue-500'],
  ['daily', 'Daily', 'Today', 'text-emerald-500', 'bg-emerald-500/10 text-emerald-500'],
  ['weekly', 'Weekly', '7 Days', 'text-purple-500', 'bg-purple-500/10 text-purple-500'],
  ['monthly', 'Monthly', 'Month', 'text-indigo-500', 'bg-indigo-500/10 text-indigo-500'],
  ['yearly', 'Yearly', 'Year', 'text-amber-500', 'bg-amber-500/10 text-amber-500']
];
$('kpi-grid').innerHTML = KPIS.map(k => `
  <div class="glass-card p-5 rounded-3xl shadow-xl flex flex-col justify-between transition-all hover:scale-[1.02]">
    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">${k[1]}</span>
    <div class="flex items-baseline justify-between mt-3">
      <span id="stat-${k[0]}" class="text-2xl font-black ${k[3]}">0</span>
      <span class="text-[9px] font-extrabold ${k[4]} px-2 py-0.5 rounded-lg">${k[2]}</span>
    </div>
  </div>`).join('');

const CHARTS = [['yearlyChart', 'Yearly Line Analytics'], ['monthlyChart', 'Monthly Line Analytics'], ['weeklyChart', 'Weekly Line Analytics'], ['taskChart', 'Tasks Distribution Line Chart']];
$('chart-grid').innerHTML = CHARTS.map(c => `
  <div class="glass-card p-6 rounded-3xl shadow-xl flex flex-col">
    <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-4">${c[1]}</h3>
    <div class="h-64 relative flex-1"><canvas id="${c[0]}"></canvas></div>
  </div>`).join('');

/* ---------- Helpers ---------- */
function toggleDarkMode() { document.documentElement.classList.toggle('dark'); renderCharts(filteredData); }
function isMobileView() { return window.innerWidth <= 768; }
function toggleSidebar() {
  if (isMobileView()) { sidebar.classList.toggle('mobile-open'); sidebarBackdrop.classList.toggle('mobile-open'); }
  else sidebar.classList.toggle('collapsed');
}
function closeMobileSidebar() { sidebar.classList.remove('mobile-open'); sidebarBackdrop.classList.remove('mobile-open'); }
window.addEventListener('resize', () => { if (!isMobileView()) closeMobileSidebar(); });

function updateProgress(percent, text) {
  $('progress-bar').style.width = percent + '%';
  $('progress-percent').innerText = percent + '%';
  $('progress-text').innerText = text;
}
function formatText(t) {
  if (!t) return '';
  return t.toString().replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}
function parseCustomDate(val) {
  if (!val) return null;
  const d = new Date(val);
  if (isNaN(d.getTime())) return null;
  const y = d.getFullYear();
  if (y < 2000 || y > 2100) return null;
  return d;
}
function toLocalISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parseInputDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* ---------- Date column (one date per row) ---------- */
let dateKeyCache = null;
function getDateKey() {
  if (dateKeyCache && headers.includes(dateKeyCache)) return dateKeyCache;
  dateKeyCache = headers.find(h => h.toLowerCase() === 'date') || headers.find(h => /date|time|created|stamp/i.test(h)) || null;
  return dateKeyCache;
}
function getRowDate(row) {
  const key = getDateKey();
  return key ? parseCustomDate(row[key]) : null;
}
function getUserKey() { return headers.find(h => h.toLowerCase().includes('name') || h.toLowerCase().includes('user')) || headers[0]; }
function getTaskKey() { return headers.length > 1 ? headers[1] : headers[0]; }

// Dates are always shown as 9/29/2026 1:36:41 PM
function getCellDisplay(row, h) {
  const v = row[h];
  if (v === undefined || v === null) return '';
  if (h === getDateKey()) {
    const d = parseCustomDate(v);
    if (d) return d.toLocaleString('en-US').replace(',', '');
  }
  return v.toString();
}

function computeCounts(data) {
  const now = new Date();
  const endOfToday = new Date(now); endOfToday.setHours(23, 59, 59, 999);
  const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  const todayStr = now.toDateString();
  let daily = 0, weekly = 0, monthly = 0, yearly = 0;
  const todayRows = new Set();
  data.forEach((row, i) => {
    const d = getRowDate(row);
    if (!d || d > endOfToday) return;
    if (d.toDateString() === todayStr) { daily++; todayRows.add(i); }
    if (d >= oneWeekAgo) weekly++;
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) monthly++;
    if (d.getFullYear() === now.getFullYear()) yearly++;
  });
  return { daily, weekly, monthly, yearly, todayRows };
}

/* ---------- Navigation / presets ---------- */
function switchPage(page) {
  if (isMobileView()) closeMobileSidebar();
  const on = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs font-bold transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/25";
  const off = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60";
  const isDash = page === 'dashboard';
  $('page-dashboard').classList.toggle('hidden', !isDash);
  $('page-main').classList.toggle('hidden', isDash);
  $('nav-dashboard').className = isDash ? on : off;
  $('nav-main').className = isDash ? off : on;
}
taskBtn.addEventListener('click', () => taskMenu.classList.toggle('hidden'));
document.addEventListener('click', e => {
  if (!taskBtn.contains(e.target) && !taskMenu.contains(e.target)) taskMenu.classList.add('hidden');
});

function uncheckPresets() { PRESETS.forEach(p => $('preset-' + p).className = PRESET_OFF); }
function setDatePreset(preset) {
  uncheckPresets();
  $('preset-' + preset).className = PRESET_ON;
  const now = new Date();
  let start = null;
  if (preset === 'weekly') start = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  if (preset === 'monthly') start = new Date(now.getFullYear(), now.getMonth(), 1);
  if (preset === 'yearly') start = new Date(now.getFullYear(), 0, 1);
  startDateInput.value = start ? toLocalISODate(start) : '';
  endDateInput.value = start ? toLocalISODate(now) : '';
  filterAndRender();
}

/* ---------- Data loading ---------- */
updateProgress(40, "Fetching data...");
fetch(targetUrl)
  .then(r => r.text())
  .then(textData => {
    updateProgress(80, "Processing dataset...");
    let parsed;
    try {
      const j = JSON.parse(textData);
      parsed = { data: Array.isArray(j) ? j : (j.data || []) };
    } catch (e) {
      parsed = Papa.parse(textData, { header: true, skipEmptyLines: true });
    }
    const data = parsed.data;
    updateProgress(100, "Completed");
    if (!data || data.length === 0) {
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> No records found!`;
      return;
    }
    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Loaded (${data.length} rows)`;
    setTimeout(() => { statusEl.style.opacity = '0'; statusEl.style.pointerEvents = 'none'; }, 3000);

    rawData = data;
    headers = Object.keys(rawData[0]).slice(0, 6);
    extractFilters();
    filteredData = rawData;
    updateAll(filteredData);
  })
  .catch(err => {
    updateProgress(100, "Failed");
    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> Connection error!`;
    console.error(err);
  });

function extractFilters() {
  const taskKey = getTaskKey(), userKey = getUserKey();
  rawData.forEach(row => {
    if (row[taskKey]) uniqueTasks.add(row[taskKey].toString().trim());
    if (row[userKey]) uniqueUsers.add(row[userKey].toString().trim());
  });
  taskMenu.innerHTML = '';
  uniqueTasks.forEach(task => {
    const div = document.createElement('label');
    div.className = "flex items-center gap-2.5 text-xs text-slate-700 dark:text-slate-300 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl transition-all";
    div.innerHTML = `<input type="checkbox" value="${task}" class="task-checkbox rounded-lg border-slate-300 dark:border-slate-700 text-blue-600 focus:ring-blue-500"> ${formatText(task)}`;
    taskMenu.appendChild(div);
  });
  document.querySelectorAll('.task-checkbox').forEach(cb => cb.addEventListener('change', filterAndRender));

  userFilterSelect.innerHTML = `<option value="">All Users</option>`;
  uniqueUsers.forEach(user => {
    const opt = document.createElement('option');
    opt.value = user; opt.textContent = formatText(user);
    userFilterSelect.appendChild(opt);
  });
  userFilterSelect.addEventListener('change', filterAndRender);
  startDateInput.addEventListener('change', () => { uncheckPresets(); filterAndRender(); });
  endDateInput.addEventListener('change', () => { uncheckPresets(); filterAndRender(); });
  searchInput.addEventListener('input', filterAndRender);
  resetBtn.addEventListener('click', resetFilters);
}

/* ---------- Filtering / sorting ---------- */
function filterAndRender() {
  const selectedUser = userFilterSelect.value;
  const startDate = parseInputDate(startDateInput.value);
  const endDate = parseInputDate(endDateInput.value);
  if (endDate) endDate.setHours(23, 59, 59, 999);
  const searchText = searchInput.value.toLowerCase().trim();
  const selectedTasks = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => cb.value);
  taskLabel.innerText = selectedTasks.length > 0 ? selectedTasks.length + " Tasks" : "Tasks";
  const userKey = getUserKey(), taskKey = getTaskKey();

  filteredData = rawData.filter(row => {
    const matchUser = !selectedUser || (row[userKey] && row[userKey].toString().trim() === selectedUser);
    const matchTask = selectedTasks.length === 0 || (row[taskKey] && selectedTasks.includes(row[taskKey].toString().trim()));
    const matchSearch = !searchText || headers.some(h => getCellDisplay(row, h).toLowerCase().includes(searchText));
    let matchCols = true;
    for (const col in columnFilters) {
      const q = (columnFilters[col] || '').toLowerCase().trim();
      if (q && !getCellDisplay(row, col).toLowerCase().startsWith(q)) { matchCols = false; break; }
    }
    let matchDate = true;
    if (startDate || endDate) {
      const d = getRowDate(row);
      matchDate = !!d && (!startDate || d >= startDate) && (!endDate || d <= endDate);
    }
    return matchUser && matchTask && matchSearch && matchCols && matchDate;
  });
  updateAll(filteredData);
}

function resetFilters() {
  userFilterSelect.value = ''; startDateInput.value = ''; endDateInput.value = ''; searchInput.value = '';
  columnFilters = {};
  document.querySelectorAll('.column-search-input').forEach(i => i.value = '');
  document.querySelectorAll('.task-checkbox').forEach(cb => cb.checked = false);
  taskLabel.innerText = "Tasks";
  currentSortColumn = null; todaySortColumn = null;
  setDatePreset('all');
}

function sortTable(column) {
  if (currentSortColumn === column) currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
  else { currentSortColumn = column; currentSortDirection = 'asc'; }
  updateAll(filteredData);
}
function sortTodayTable(column) {
  if (todaySortColumn === column) todaySortDirection = todaySortDirection === 'asc' ? 'desc' : 'asc';
  else { todaySortColumn = column; todaySortDirection = 'asc'; }
  renderTableAndCards(filteredData);
}

function updateAll(data) {
  if (currentSortColumn) {
    filteredData.sort((a, b) => {
      const A = a[currentSortColumn] !== undefined ? a[currentSortColumn] : '';
      const B = b[currentSortColumn] !== undefined ? b[currentSortColumn] : '';
      if (A < B) return currentSortDirection === 'asc' ? -1 : 1;
      if (A > B) return currentSortDirection === 'asc' ? 1 : -1;
      return 0;
    });
  }
  renderTableAndCards(data);
  renderCharts(data);
}

/* ---------- Charts ---------- */
function renderCharts(data) {
  const isDark = document.documentElement.classList.contains('dark');
  const textColor = isDark ? '#94a3b8' : '#64748b';
  const gridColor = isDark ? '#1e293b' : '#e2e8f0';
  const counts = computeCounts(data);
  const taskKey = getTaskKey();

  const taskCounts = {};
  data.forEach(row => {
    if (row[taskKey]) { const t = formatText(row[taskKey]); taskCounts[t] = (taskCounts[t] || 0) + 1; }
  });

  const options = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, precision: 0 } },
      x: { grid: { display: false }, ticks: { color: textColor } }
    }
  };
  function line(id, label, labels, values, color, bg) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id).getContext('2d'), {
      type: 'line',
      data: { labels, datasets: [{ label, data: values, borderColor: color, backgroundColor: bg, fill: true, tension: 0.4, borderWidth: 3 }] },
      options
    });
  }
  line('yearlyChart', 'Yearly Cases', [String(new Date().getFullYear())], [counts.yearly], '#f59e0b', 'rgba(245,158,11,0.1)');
  line('monthlyChart', 'Monthly Cases', ['This Month'], [counts.monthly], '#6366f1', 'rgba(99,102,241,0.1)');
  line('weeklyChart', 'Weekly Cases', ['Last 7 Days'], [counts.weekly], '#a855f7', 'rgba(168,85,247,0.1)');
  const names = Object.keys(taskCounts);
  line('taskChart', 'Task Count', names.length ? names : ['No Tasks'], names.length ? Object.values(taskCounts) : [0], '#3b82f6', 'rgba(59,130,246,0.1)');
}

/* ---------- Tables, KPI cards, leaderboard ---------- */
function renderTableAndCards(data) {
  const tbody = $('table-body');
  $('table-head').innerHTML = `<tr><th class="p-3 font-bold">#</th>${headers.map(h => {
    const ind = currentSortColumn === h ? (currentSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
    const isImg = h.toLowerCase().includes('image');
    return `<th class="p-3">
      <div class="flex items-center justify-between cursor-pointer mb-1.5 hover:text-blue-500 transition-colors" onclick="sortTable('${h}')"><span>${h}${ind}</span></div>
      ${isImg ? '' : `<input type="text" placeholder="Filter ${h}..." value="${columnFilters[h] || ''}" oninput="handleColumnSearch('${h}', this.value, event)" onclick="event.stopPropagation()" onfocus="this.setSelectionRange(this.value.length, this.value.length);" class="column-search-input w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-slate-700/80 text-[11px] font-semibold text-slate-700 dark:text-slate-200 px-2.5 py-1.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">`}
    </th>`;
  }).join('')}</tr>`;

  tbody.innerHTML = '';
  $('stat-total').innerText = rawData.length;
  const counts = computeCounts(data);
  const todayMap = {}, userCounts = {};
  const userKey = getUserKey(), taskKey = getTaskKey();

  data.forEach((row, index) => {
    const user = row[userKey] ? formatText(row[userKey]) : "Unknown";
    const task = row[taskKey] ? formatText(row[taskKey]) : "General";
    userCounts[user] = (userCounts[user] || 0) + 1;
    if (counts.todayRows.has(index)) { const k = user + "___" + task; todayMap[k] = (todayMap[k] || 0) + 1; }

    const tr = document.createElement('tr');
    tr.className = "hover:bg-slate-50 dark:hover:bg-dark-800/50 transition-all";
    const tdI = document.createElement('td');
    tdI.className = "p-3 font-bold text-slate-400"; tdI.innerText = index + 1;
    tr.appendChild(tdI);
    headers.forEach(h => {
      const td = document.createElement('td');
      td.className = "p-3"; td.innerText = getCellDisplay(row, h);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  ['daily', 'weekly', 'monthly', 'yearly'].forEach(k => $('stat-' + k).innerText = counts[k]);

  // Leaderboard
  const lb = $('leaderboard-container');
  lb.innerHTML = '';
  const users = Object.keys(userCounts).sort((a, b) => userCounts[b] - userCounts[a]);
  const max = users.length ? userCounts[users[0]] : 1;
  if (!users.length) {
    lb.innerHTML = `<div class="text-center text-slate-400 py-4 text-xs">No user data available for ranking in this date range.</div>`;
  } else {
    const badges = [
      'bg-gradient-to-tr from-amber-500 to-yellow-400 text-white shadow-md shadow-amber-500/30',
      'bg-gradient-to-tr from-slate-300 to-slate-400 text-white shadow-md',
      'bg-gradient-to-tr from-amber-700 to-amber-600 text-white shadow-md'
    ];
    users.forEach((user, idx) => {
      const c = userCounts[user];
      const badge = badges[idx] || 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
      const div = document.createElement('div');
      div.className = "flex items-center gap-4 p-3.5 rounded-2xl bg-white/50 dark:bg-dark-900/50 border border-slate-200/60 dark:border-slate-800/60 transition-all hover:scale-[1.01]";
      div.innerHTML = `
        <div class="w-8 h-8 rounded-xl ${badge} flex items-center justify-center font-black text-xs flex-shrink-0">#${idx + 1}</div>
        <div class="flex-1 space-y-1.5">
          <div class="flex justify-between items-center text-xs">
            <span class="font-extrabold text-slate-800 dark:text-slate-200">${user}</span>
            <span class="font-black text-blue-600 dark:text-blue-400">${c} Cases</span>
          </div>
          <div class="w-full bg-slate-200/70 dark:bg-dark-800 h-2 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-all duration-500" style="width:${Math.round(c / max * 100)}%"></div>
          </div>
        </div>`;
      lb.appendChild(div);
    });
  }

  // Today's activity
  const ind = col => todaySortColumn === col ? (todaySortDirection === 'asc' ? ' ▲' : ' ▼') : '';
  $('today-table-head').innerHTML = `<tr>
    <th class="p-4">#</th>
    <th class="p-4 hover:text-blue-500" onclick="sortTodayTable('user')">User Name${ind('user')}</th>
    <th class="p-4 hover:text-blue-500" onclick="sortTodayTable('task')">Task Name${ind('task')}</th>
    <th class="p-4 text-right hover:text-blue-500" onclick="sortTodayTable('count')">Count${ind('count')}</th></tr>`;

  const items = Object.keys(todayMap).map(k => {
    const p = k.split('___');
    return { user: p[0], task: p[1], count: todayMap[k] };
  });
  if (todaySortColumn) {
    items.sort((a, b) => {
      const A = a[todaySortColumn], B = b[todaySortColumn];
      if (A < B) return todaySortDirection === 'asc' ? -1 : 1;
      if (A > B) return todaySortDirection === 'asc' ? 1 : -1;
      return 0;
    });
  }
  const body = $('today-activity-body');
  $('today-count-badge').innerText = counts.todayRows.size + " Cases Today";
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No activity recorded for today.</td></tr>`;
  } else {
    body.innerHTML = items.map((it, i) => `<tr class="hover:bg-slate-50 dark:hover:bg-dark-800/50 transition-all">
      <td class="p-3 font-bold text-slate-400">${i + 1}</td>
      <td class="p-3 font-semibold">${it.user}</td>
      <td class="p-3"><span class="bg-slate-100 dark:bg-dark-800 px-2.5 py-1 rounded-xl">${it.task}</span></td>
      <td class="p-3 text-right font-black text-blue-500">${it.count}</td></tr>`).join('');
  }
}

function handleColumnSearch(column, value) {
  columnFilters[column] = value;
  filterAndRender();
  document.querySelectorAll('.column-search-input').forEach(inp => {
    if (inp.getAttribute('oninput').includes(`'${column}'`)) {
      inp.focus();
      const v = inp.value; inp.value = ''; inp.value = v;
    }
  });
}

/* ---------- Export ---------- */
function exportCSV() {
  if (!filteredData.length) return alert("No data to export!");
  const blob = new Blob([Papa.unparse(filteredData)], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'AppSheet_QA_Export.csv'; a.click();
}
function exportExcel() {
  if (!filteredData.length) return alert("No data to export!");
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filteredData), "QA Data");
  XLSX.writeFile(wb, 'AppSheet_QA_Export.xlsx');
}
</script>
